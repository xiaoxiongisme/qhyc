[pytest]
# 注册自定义标记（否则 @pytest.mark.slow 会触发 PytestUnknownMarkWarning）。
# slow = 真实连库并循环数百次的守护测试（如 P1-1 连接泄漏回归，耗时约 4 分钟），
# 日常快速回归可用 -m "not slow" 跳过。
markers =
    slow: 真实连库且循环数百次的慢速守护测试（-m "not slow" 可跳过）
    requires_db: 需要可达且已 seed 的 Postgres（设置 DATABASE_URL）；无 DB 环境按 Feathers 法自动 skip
# 仅收集 tests/ 下的用例。遗留问题修复（2026-10-13）：scripts/ 下存在手动冒烟脚本
# ctp_gateway_smoke_test.py（匹配 *_test.py 模式），其 import 的 ctp_gateway 在模块顶层
# raise SystemExit(2)，会在收集阶段整轮崩溃（INTERNALERROR → 0 用例运行）。
# 该脚本是手工 smoke 工具而非单元用例，不应被自动收集；tests/ 内 13 个用例才需运行。
testpaths = tests