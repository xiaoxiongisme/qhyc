<svg viewBox="0 0 680 340" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="680" height="340" fill="#FBFAF7"/><text x="40.0" y="26.0" font-size="14" fill="#26215C" text-anchor="start" font-weight="600">共尾的双基准：压力放大（train 标定）vs 结构共尾（窗口自身）</text><text x="40.0" y="44.0" font-size="10.5" fill="#888780" text-anchor="start" font-weight="400">甲醇 MA；同一条共尾事实回答两个不同问题：相对全历史训练基准放大了多少 / 窗口内部结构上共尾多少</text><line x1="60.0" y1="240.0" x2="640.0" y2="240.0" stroke="#E8E6DE" stroke-width="1"/><text x="54.0" y="243.0" font-size="9" fill="#888780" text-anchor="end" font-weight="400">0×</text><line x1="60.0" y1="200.0" x2="640.0" y2="200.0" stroke="#E8E6DE" stroke-width="1"/><text x="54.0" y="203.0" font-size="9" fill="#888780" text-anchor="end" font-weight="400">15×</text><line x1="60.0" y1="160.0" x2="640.0" y2="160.0" stroke="#E8E6DE" stroke-width="1"/><text x="54.0" y="163.0" font-size="9" fill="#888780" text-anchor="end" font-weight="400">30×</text><line x1="60.0" y1="120.0" x2="640.0" y2="120.0" stroke="#E8E6DE" stroke-width="1"/><text x="54.0" y="123.0" font-size="9" fill="#888780" text-anchor="end" font-weight="400">45×</text><line x1="60.0" y1="80.0" x2="640.0" y2="80.0" stroke="#E8E6DE" stroke-width="1"/><text x="54.0" y="83.0" font-size="9" fill="#888780" text-anchor="end" font-weight="400">60×</text><rect x="68.0" y="171.7" width="31.4" height="68.3" rx="2" fill="#3E3480" fill-opacity="0.9"/><text x="83.7" y="167.7" font-size="8.5" fill="#3E3480" text-anchor="middle" font-weight="600">26×</text><rect x="101.4" y="231.8" width="31.4" height="8.2" rx="2" fill="#D97B29" fill-opacity="0.6"/><text x="117.1" y="227.8" font-size="8.5" fill="#D97B29" text-anchor="middle" font-weight="600">3.1×</text><text x="101.4" y="254.0" font-size="9" fill="#26215C" text-anchor="middle" font-weight="400">2020崩盘</text><rect x="150.9" y="126.9" width="31.4" height="113.1" rx="2" fill="#3E3480" fill-opacity="0.9"/><text x="166.6" y="122.9" font-size="8.5" fill="#3E3480" text-anchor="middle" font-weight="600">42×</text><rect x="184.3" y="233.7" width="31.4" height="6.3" rx="2" fill="#D97B29" fill-opacity="0.6"/><text x="200.0" y="229.7" font-size="8.5" fill="#D97B29" text-anchor="middle" font-weight="600">2.4×</text><text x="184.3" y="254.0" font-size="9" fill="#26215C" text-anchor="middle" font-weight="400">2020反弹</text><rect x="233.7" y="122.7" width="31.4" height="117.3" rx="2" fill="#3E3480" fill-opacity="0.9"/><text x="249.4" y="118.7" font-size="8.5" fill="#3E3480" text-anchor="middle" font-weight="600">44×</text><rect x="267.1" y="231.3" width="31.4" height="8.7" rx="2" fill="#D97B29" fill-opacity="0.6"/><text x="282.9" y="227.3" font-size="8.5" fill="#D97B29" text-anchor="middle" font-weight="600">3.3×</text><text x="267.1" y="254.0" font-size="9" fill="#26215C" text-anchor="middle" font-weight="400">2021牛</text><rect x="316.6" y="234.2" width="31.4" height="5.8" rx="2" fill="#3E3480" fill-opacity="0.9"/><text x="332.3" y="230.2" font-size="8.5" fill="#3E3480" text-anchor="middle" font-weight="600">2.2×</text><rect x="350.0" y="227.7" width="31.4" height="12.3" rx="2" fill="#D97B29" fill-opacity="0.6"/><text x="365.7" y="223.7" font-size="8.5" fill="#D97B29" text-anchor="middle" font-weight="600">4.6×</text><text x="350.0" y="254.0" font-size="9" fill="#26215C" text-anchor="middle" font-weight="400">2025关税</text><rect x="399.4" y="87.0" width="31.4" height="153.0" rx="2" fill="#3E3480" fill-opacity="0.9"/><text x="415.1" y="83.0" font-size="8.5" fill="#3E3480" text-anchor="middle" font-weight="600">57×</text><rect x="432.9" y="232.1" width="31.4" height="7.9" rx="2" fill="#D97B29" fill-opacity="0.6"/><text x="448.6" y="228.1" font-size="8.5" fill="#D97B29" text-anchor="middle" font-weight="600">3.0×</text><text x="432.9" y="254.0" font-size="9" fill="#26215C" text-anchor="middle" font-weight="400">2026挤仓</text><rect x="482.3" y="239.2" width="31.4" height="0.8" rx="2" fill="#3E3480" fill-opacity="0.9"/><text x="498.0" y="235.2" font-size="8.5" fill="#3E3480" text-anchor="middle" font-weight="600">0.3×</text><rect x="515.7" y="230.0" width="31.4" height="10.0" rx="2" fill="#D97B29" fill-opacity="0.6"/><text x="531.4" y="226.0" font-size="8.5" fill="#D97B29" text-anchor="middle" font-weight="600">3.7×</text><text x="515.7" y="254.0" font-size="9" fill="#26215C" text-anchor="middle" font-weight="400">2024平静</text><rect x="565.1" y="229.2" width="31.4" height="10.8" rx="2" fill="#3E3480" fill-opacity="0.9"/><text x="580.9" y="225.2" font-size="8.5" fill="#3E3480" text-anchor="middle" font-weight="600">4.1×</text><rect x="598.6" y="229.1" width="31.4" height="10.9" rx="2" fill="#D97B29" fill-opacity="0.6"/><text x="614.3" y="225.1" font-size="8.5" fill="#D97B29" text-anchor="middle" font-weight="600">4.1×</text><text x="598.6" y="254.0" font-size="9" fill="#26215C" text-anchor="middle" font-weight="400">训练集</text><rect x="60.0" y="262.0" width="12.0" height="10.0" rx="3" fill="#3E3480" fill-opacity="0.9"/><text x="78.0" y="271.0" font-size="9.5" fill="#5F5E5A" text-anchor="start" font-weight="400">train 标定基准（压力放大倍数）</text><rect x="270.0" y="262.0" width="12.0" height="10.0" rx="3" fill="#D97B29" fill-opacity="0.6"/><text x="288.0" y="271.0" font-size="9.5" fill="#5F5E5A" text-anchor="start" font-weight="400">窗口自身基准（结构性共尾）</text><text x="60.0" y="292.0" font-size="10" fill="#26215C" text-anchor="start" font-weight="600">五个极端窗口：压力放大 25.6–57.4×，而结构共尾稳定在 2.4–4.6×；平静年结构共尾仅 0.31×</text><text x="60.0" y="308.0" font-size="9.5" fill="#5F5E5A" text-anchor="start" font-weight="400">口径提示：2025-04 的 naive 基准（68.2×）是关税月自身高频事件压扁基准造成的失真，故一律采用 slot 调整基准</text></svg>