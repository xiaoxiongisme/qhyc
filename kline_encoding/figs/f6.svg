<svg viewBox="0 0 680 330" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="680" height="330" fill="#FBFAF7"/><text x="40.0" y="26.0" font-size="14" fill="#26215C" text-anchor="start" font-weight="600">Kronos 基础模型零样本基准：同一任务（下一根振幅五档 · holdout）</text><text x="40.0" y="44.0" font-size="10.5" fill="#888780" text-anchor="start" font-weight="400">上下文 512 根、每点 20 样本 T=1.0/top_p=0.95；与轻量模型同口径 log-loss + top-1</text><line x1="60.0" y1="205.3" x2="400.0" y2="205.3" stroke="#E8E6DE" stroke-width="1"/><text x="54.0" y="208.3" font-size="9" fill="#888780" text-anchor="end" font-weight="400">1.0</text><line x1="60.0" y1="170.7" x2="400.0" y2="170.7" stroke="#E8E6DE" stroke-width="1"/><text x="54.0" y="173.7" font-size="9" fill="#888780" text-anchor="end" font-weight="400">2.0</text><line x1="60.0" y1="136.0" x2="400.0" y2="136.0" stroke="#E8E6DE" stroke-width="1"/><text x="54.0" y="139.0" font-size="9" fill="#888780" text-anchor="end" font-weight="400">3.0</text><line x1="60.0" y1="101.3" x2="400.0" y2="101.3" stroke="#E8E6DE" stroke-width="1"/><text x="54.0" y="104.3" font-size="9" fill="#888780" text-anchor="end" font-weight="400">4.0</text><rect x="70.0" y="99.8" width="34.5" height="140.2" rx="2" fill="#B0543A" fill-opacity="0.9"/><line x1="87.2" y1="93.9" x2="87.2" y2="105.6" stroke="#26215C" stroke-width="1.2"/><text x="87.2" y="95.8" font-size="8.5" fill="#B0543A" text-anchor="middle" font-weight="600">4.05</text><text x="87.2" y="253.0" font-size="8" fill="#5F5E5A" text-anchor="middle" font-weight="400">Kronos</text><rect x="107.5" y="178.8" width="34.5" height="61.2" rx="2" fill="#3E3480" fill-opacity="0.9"/><text x="124.8" y="174.8" font-size="8.5" fill="#3E3480" text-anchor="middle" font-weight="600">1.76</text><text x="124.8" y="253.0" font-size="8" fill="#5F5E5A" text-anchor="middle" font-weight="400">HMM</text><rect x="145.0" y="161.1" width="34.5" height="78.9" rx="2" fill="#A397D2" fill-opacity="0.9"/><text x="162.2" y="157.1" font-size="8.5" fill="#A3