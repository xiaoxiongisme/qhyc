or="middle" font-weight="600">0.49</text><text x="741.0" y="253.0" font-size="8" fill="#5F5E5A" text-anchor="middle" font-weight="400">HMM</text><text x="450.0" y="268.0" font-size="9.5" fill="#5F5E5A" text-anchor="start" font-weight="400">top-1 准确率（随机基线 0.20）</text><text x="60.0" y="292.0" font-size="10" fill="#26215C" text-anchor="start" font-weight="600">Kronos 零样本 nll：MA 4.05±0.17 / EG 4.31±0.16（N=200，均匀基线 2.32 的 ~1.8 倍劣化）vs HMM 1.77 / 1.68</text><text x="60.0" y="308.0" font-size="9.5" fill="#5F5E5A" text-anchor="start" font-weight="400">解读：两级残差量化 token + 自回归采样在 512 上下文里对「下一分钟振幅」过平滑；EG 的 4000 个预测点几乎全部坍缩到最低档，</text><text x="60.0" y="324.0" font-size="9.5" fill="#5F5E5A" text-anchor="start" font-weight="400">MA 也系统性偏移。局限：零样本、CPU、20 样本/点；不否定 Kronos 在长周期形态任务上的能力</text></svg>