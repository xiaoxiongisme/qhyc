<text x="227.2" y="160.0" font-size="10" fill="#26215C" text-anchor="start" font-weight="600">2.739 bit</text>
<text x="140.0" y="194.0" font-size="10" fill="#26215C" text-anchor="end" font-weight="400">块熵 k=3（熵率）</text>
<rect x="150.0" y="180.0" width="70.8" height="20.0" rx="3" fill="#3E3480" fill-opacity="1.0"/>
<text x="226.8" y="194.0" font-size="10" fill="#26215C" text-anchor="start" font-weight="600">2.722 bit</text>
<line x1="150.0" y1="78.0" x2="150.0" y2="214.0" stroke="#888780" stroke-width="1"/>
<text x="150.0" y="232.0" font-size="9" fill="#888780" text-anchor="middle" font-weight="400">0</text>
<text x="228.0" y="232.0" font-size="9" fill="#888780" text-anchor="middle" font-weight="400">3</text>
<line x1="306.0" y1="70.0" x2="306.0" y2="214.0" stroke="#C4372E" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="306.0" y="66.0" font-size="9.5" fill="#C4372E" text-anchor="middle" font-weight="600">六位码 = 6 bit</text>
<text x="40.0" y="262.0" font-size="10.5" fill="#26215C" text-anchor="start" font-weight="600">压缩率 = 2.722 / 6 = 45.4%   有效字母表 = e^2.93 ≈ 18.7 个等价态</text>
<text x="40.0" y="280.0" font-size="9.5" fill="#888780" text-anchor="start" font-weight="400">EG 复验: 熵率 2.780 bit（46.3%），两品种一致</text>
