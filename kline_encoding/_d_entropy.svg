<text x="227.8" y="126.0" font-size="10" fill="#26215C" text-anchor="start" font-weight="600">2.760 bit</text>
<text x="140.0" y="160.0" font-size="10" fill="#26215C" text-anchor="end" font-weight="400">块熵 k=2</text>
