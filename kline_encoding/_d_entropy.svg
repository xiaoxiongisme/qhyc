<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg">
<text x="40.0" y="26.0" font-size="14" fill="#26215C" text-anchor="start" font-weight="600">维度一 · 信息论与压缩：六位码每根只携带 2.72 比特</text>
<text x="40.0" y="44.0" font-size="10.5" fill="#888780" text-anchor="start" font-weight="400">熵率 = 块熵 H(下一态 | 前三态)；对比 6 bit 编码上限</text>
<text x="140.0" y="92.0" font-size="10" fill="#26215C" text-anchor="end" font-weight="400">H(当前状态)</text>
<rect x="150.0" y="78.0" width="76.1" height="20.0" rx="3" fill="#6E5FB8" fill-opacity="1.0"/>
<text x="232.1" y="92.0" font-size="10" fill="#26215C" text-anchor="start" font-weight="600">2.927 bit</text>
<text x="140.0" y="126.0" font-size="10" fill="#26215C" text-anchor="end" font-weight="400">H(下一态 | 当前态)</text>
