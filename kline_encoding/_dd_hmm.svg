ity="0.85"/><text x="620.0" y="186.0" font-size="8.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">μ=15.370%</text><line x1="460.0" y1="230.0" x2="640.0" y2="230.0" stroke="#E8E6DE" stroke-width="1"/><text x="460.0" y="248.0" font-size="10" fill="#26215C" text-anchor="start" font-weight="600">隐状态 = 波动体制（低/中/高波）</text><text x="460.0" y="264.0" font-size="9.5" fill="#5F5E5A" text-anchor="start" font-weight="400">平均持续 MA [1.5, 4.8, 26.1] 根</text><text x="460.0" y="280.0" font-size="9.5" fill="#5F5E5A" text-anchor="start" font-weight="400">vs 八卦态持续 1.0~1.35 根</text><text x="460.0" y="296.0" font-size="9.5" fill="#5F5E5A" text-anchor="start" font-weight="400">隐态×显态互信息仅 0.167 bit</text><text x="460.0" y="312.0" font-size="9.5" fill="#5F5E5A" text-anchor="start" font-weight="400">EG 低波体制持续 51 根：体制是慢变量</text></svg>