# =====================================================
# 期货预测平台 - 云端配置（M7 起）
# 与 local.yaml 字段同构，云端切换由环境变量 / docker-compose.cloud.yml 注入
# =====================================================
app:
  name: qhyc
  env: cloud
  debug: false
  log_level: INFO
  timezone: Asia/Shanghai

database:
  url_env: DATABASE_URL
  pool_size: 10
  max_overflow: 20
  echo: false

ingest:
