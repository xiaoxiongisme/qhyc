    - { symbol: "SC888", exchange: "INE", product: "SC", name: "原油", unit: "桶", multiplier: 1000 }
    # ---- GFEX 广州期货交易所 ----
    - { symbol: "SI888", exchange: "GFEX", product: "SI", name: "工业硅", unit: "吨", multiplier: 5 }
