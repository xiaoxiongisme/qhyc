    - { symbol: "JD888", exchange: "DCE", product: "JD", name: "鸡蛋", unit: "吨", multiplier: 5 }
    - { symbol: "L888",  exchange: "DCE", product: "L",  name: "塑料", unit: "吨", multiplier: 5 }
    - { symbol: "V888",  exchange: "DCE", product: "V",  name: "PVC", unit: "吨", multiplier: 5 }
    - { symbol: "PP888", exchange: "DCE", product: "PP", name: "聚丙烯", unit: "吨", multiplier: 5 }
    - { symbol: "J888",  exchange: "DCE", product: "J",  name: "焦炭", unit: "吨", multiplier: 100 }
    - { symbol: "JM888", exchange: "DCE", product: "JM", name: "焦煤", unit: "吨", multiplier: 60 }
    - { symbol: "I888",  exchange: "DCE", product: "I",  name: "铁矿石", unit: "吨", multiplier: 100 }
    - { symbol: "EG888", exchange: "DCE", product: "EG", name: "乙二醇", unit: "吨", multiplier: 10 }
    - { symbol: "EB888", exchange: "DCE", product: "EB", name: "苯乙烯", unit: "吨", multiplier: 5 }
    - { symbol: "LH888", exchange: "DCE", product: "LH", name: "生猪", unit: "吨", multiplier: 16 }
  tqsdk_symbol_template: "KQ.m@{exchange}.{product}"

calibration:
  price_diff_threshold_pct: 0.5
  volume_anomaly: true
  timeout_sec: 20
  max_retries: 3

scheduler:
  cron:
    - { hour: 8,  minute: 0,  label: "pre_open" }
    - { hour: 12, minute: 30, label: "midday" }
    - { hour: 20, minute: 0,  label: "pre_night" }
  hourly:
    enabled: true
    minute: 0
    run_hour: "all"

imports:
  source_root: ""        # 云端不直接导入本地历史；走 pg_dump 迁移
  container_root: ""
  format_version: 1

backtest:
  label_metric: close
  min_sample_n: 60
  min_symbols_in_run: 10
  lstm_weight_freeze: null
  lstm_retrain_every: 60
  cost_pct: 0.065
  coverage_grid: [0.1, 0.2, 0.3, 0.5, 0.7, 1.0]

predict:
  model_set: m3
  history_bars: 250
  min_bars: 60
  weights:
    fourier: 1.0
    markov: 1.0
    arima: 1.0
    garch: 0.8
    kalman: 1.0
    hmm: 1.0
    bayesian: 1.0
    montecarlo: 1.0
    lstm: 1.2
    reversal: 1.2
    rf_pool: 0.3            # M6c.1 池化分类：OOS 0.506（|t|≈2.7 边际显著，远低于反转 0.535）→ 低权重
    xgb_pool: 0.0           # M6c.1 池化分类：OOS 0.503 p=0.23 未过 |t|>2 → 不给权重（仍注册供研究）
  gate_models:
    trend: ["arima", "fourier", "kalman", "lstm", "hmm", "reversal", "rf_pool", "xgb_pool"]
    mean_revert: ["markov", "bayesian", "montecarlo", "garch", "fourier", "reversal", "rf_pool", "xgb_pool"]
    neutral: ["fourier", "markov", "arima", "kalman", "montecarlo", "hmm", "bayesian", "reversal", "garch", "rf_pool", "xgb_pool"]
  pooled:
    window: 250
    n_estimators: 200
    max_depth: 6
    model_dir: "/app/runtime/pooled"
    train_end: null
  reversal:
    gate_pct: 2.0            # v1.3.3 对齐 research τ*=2.0%（验收=上线）
    strength: 0.3
    oi_boost_prob: 0.05
    max_prob: 0.85

# =============================================================================
# Phase 4/5 新增开关（2026-09-29）
# 说明：这几项目前由**环境变量**控制（避免本地/云端配置文件分叉），
#       此处仅登记口径，改配置需同步改 docker-compose.cloud.yml 的 environment。
# -----------------------------------------------------------------------------
# scheduler.env:
#   FACTOR_COMPUTE_ENABLED=1          # 16:20 因子计算（默认开）
#   FACTOR_COMPUTE_LOOKBACK_DAYS=60   # 增量回溯天数（全量用 FACTOR_COMPUTE_SINCE=2015）
#   FACTOR_IC_MONITOR_ENABLED=1       # 16:45 滚动 IC 监控（默认开）
#   FACTOR_IC_WINDOW=20               # 滚动窗口（交易日）
#   DATA_SELFCHECK_ENABLED=0          # 17:35 数据自检（默认**关**，只写 anomaly_ticket）
#   DATA_SELFCHECK_MISSING_PCT=0.05
#   DATA_SELFCHECK_ZERO_VOL_DAYS=3
#   PORTFOLIO_BRAKE_ENABLED=0         # 组合回撤熔断（默认**关**）
#   PORTFOLIO_BRAKE_DD_WARN=0.15      # >15% → 半仓（scalar 0.5）
#   PORTFOLIO_BRAKE_DD_STOP=0.25      # >25% → 清仓（scalar 0.0）
#   PORTFOLIO_BRAKE_LOOKBACK=250
#
# 熔断依赖 portfolio_equity（migrations/004 建表）：
#   trade_date / equity（累计权益，优先）/ realized_pnl（无 equity 时累加）
#   表为空或缺失 → scalar 恒为 1.0（等价关闭），绝不阻断决策链。
