    - { symbol: "PX888", exchange: "CZCE", product: "PX", name: "对二甲苯", unit: "吨", multiplier: 5 }
    - { symbol: "SF888", exchange: "CZCE", product: "SF", name: "硅铁", unit: "吨", multiplier: 5 }
