calibration:
  price_diff_threshold_pct: 0.5
  volume_anomaly: true
  timeout_sec: 20
  max_retries: 3

scheduler:
  cron:
    - { hour: 8,  minute: 0,  label: "pre_open" }
    - { hour: 12, minute: 30, label: "midday" }
    - { hour: 20, minute: 0,  label: "pre_night" }
  hourly:
    enabled: true
    minute: 0
    run_hour: "all"

# ---- 采集类作业开关（2026-10-05 显式化，对齐 local.yaml）------------------
# 起因：这些段此前**完全缺失**于 cloud.yaml，落到 app/core/config.py 的代码默认值。
# 其中 rank_position.enabled 默认 False → _rank_job 每天 17:30 被调用后立刻 return，
# 仅打 INFO 无告警，致 member_position_rank 自 2026-09-24 起停更 11 天，
# 并使 pipeline readiness 恒 False（spot_basis=0 member_position_rank=0）。
# 约定：**采集类开关一律显式写在这里**，停采必须是可见的显式动作。
# ★ 两份 yaml 必须保持一致：任何"只在 local 有、云端缺"的段都会让云端落到代码默认值。
rank_position:
  enabled: true          # 会员持仓排名（龙虎榜）17:30；CZCE/SHFE/GFEX→akshare, DCE→dce_scrapling
  exchanges: ["CZCE", "SHFE", "DCE", "GFEX"]
  run_hour: 17
  run_minute: 30
# 库存 / 仓单：2026-10-03 曾拍板**停采集**（akshare 源覆盖不全且与仓单表重叠，
# inventory_z 在 IC 扫描中无显著贡献：pooled|ρ|=0.96、IC(h=5)=-0.058/t=-1.76）。
# 2026-10-07 按《海龟×融合叠加回测报告》CB 清单 #2 要求**恢复采集**：
#   · 恢复的是**数据采集**（周频，成本极低）—— 因子退役期间的历史数据是未来
#     重估的唯一原料，停采等于把「可回滚性」永久销毁；
#   · **inventory_z 因子仍保持退役**（factor_registry.enabled=false、weight=-0.08
#     未动）。恢复采集 ≠ 恢复启用，两者刻意分离，避免后人误读为「已重新上线」。
#   · 仓单表同期已修好 CZCE 静默失效（akshare 返回形态变更），2021-2023 空洞
#     正在回补；待 inventory 积累足够覆盖后重估 ρ 与 IC，再决定是否解退役。
inventory:
  enabled: true
  freq: "daily"
  run_day: "mon-fri"
  run_hour: 17
  run_minute: 0
spot_basis:
  enabled: true          # 基差/现货日频 17:10（akshare futures_spot_price_daily）
  freq: "daily"
  run_hour: 17
  run_minute: 10
  window_days: 5

# 仓单日报（R3，scrapling 浏览器版，四所全量）18:40；
# 需镜像以 WITH_SCRAPLING=1 构建（装 scrapling + 无头 Chromium）后作业才成功。
warehouse_receipt:
  enabled: true
  run_hour: 18
  run_minute: 40

# M8 决策链路容器化（2026-10-05 显式化，对齐 local.yaml）
# 云端此前**缺整个 pipeline 段**，全部落代码默认值（值恰好相同纯属巧合，
# 一旦调整默认值云端会静默漂移）。五条子链路源码真源在 WB skill，
# 由 compose 只读挂载 /app/pipeline_src 带入容器。
pipeline:
  enabled: true
  daily_cron: { hour: 17, minute: 40 }   # 17:40：给 rank_position(17:30) 留 10 分钟
  signal_slots: ["09:00", "10:00", "11:00", "13:30", "14:00", "15:00", "21:00", "22:00", "23:00"]
  intraday_enabled: true                  # 整点：先盘中监控（串行），再信号推送
  check_cron: { day_of_week: mon, hour: 8, minute: 5 }
  readiness:
    enabled: true
    timeout_min: 10                       # 等当日 spot_basis + member_position_rank
    poll_sec: 60
  snapshot:
    src: "/app/pipeline_src"              # 只读挂载（WB 单一真源）
    dest: "/app/runtime/pipeline_snapshot" # 启动快照（子进程跑这份副本）
  step_timeout_sec: 1800
  max_instances: 1
  notify_on_failure: true

imports:
  source_root: ""        # 云端不直接导入本地历史；走 pg_dump 迁移
  container_root: ""
  format_version: 1

backtest:
  label_metric: close
  min_sample_n: 60
  min_symbols_in_run: 10
  lstm_weight_freeze: null
  lstm_retrain_every: 60
  cost_pct: 0.065
  coverage_grid: [0.1, 0.2, 0.3, 0.5, 0.7, 1.0]

predict:
  model_set: m3
  history_bars: 250
  min_bars: 60
  weights:
    fourier: 1.0
    markov: 1.0
    arima: 1.0
    garch: 0.8
    kalman: 1.0
    hmm: 1.0
    bayesian: 1.0
    montecarlo: 1.0
    lstm: 1.2
    reversal: 1.2
    rf_pool: 0.3            # M6c.1 池化分类：OOS 0.506（|t|≈2.7 边际显著，远低于反转 0.535）→ 低权重
    xgb_pool: 0.0           # M6c.1 池化分类：OOS 0.503 p=0.23 未过 |t|>2 → 不给权重（仍注册供研究）
  gate_models:
    trend: ["arima", "fourier", "kalman", "lstm", "hmm", "reversal", "rf_pool", "xgb_pool"]
    mean_revert: ["markov", "bayesian", "montecarlo", "garch", "fourier", "reversal", "rf_pool", "xgb_pool"]
    neutral: ["fourier", "markov", "arima", "kalman", "montecarlo", "hmm", "bayesian", "reversal", "garch", "rf_pool", "xgb_pool"]
  pooled:
    window: 250
    n_estimators: 200
    max_depth: 6
    model_dir: "/app/runtime/pooled"
    train_end: null
  reversal:
    gate_pct: 2.0            # v1.3.3 对齐 research τ*=2.0%（验收=上线）
    strength: 0.3
    oi_boost_prob: 0.05
    max_prob: 0.85
# ---------------------------------------------------------------------------
# 策略参数/启用状态覆盖层（CL-20261108-09，2026-11-09 接线）
#
# 这是**唯一**能让「改配置即调参」真正生效的入口。写法：
#
#   strategies:
#     fusion_v34:            # 注册表 key（app/strategies/registry.py::REGISTRY）
#       enabled: true        # 省略 = 沿用注册表默认
#       params:              # 字段名必须是 FusionConfig 的字段；拼错会被丢弃并记 error
#         sl_atr: 1.5
#
# ⚠ 两条纪律：
#   1. 任何**偏离代码默认**的覆盖都会让 `OPS-FUSION-PROFILE-PINNED`（block）
#      失败——那是刻意的：融合参数是回测定稿口径，线上改动必须先过回测闸门，
#      登记台账并重钉 `PINNED_FUSION_SIGNAL_HASH`，不能悄悄改。
#   2. 生产 `cloud.yaml` 目前**没有**这一段，所以「生效参数 = 代码默认」。
#      这里只给形状，取消注释前先想清楚上面第 1 条。
# ---------------------------------------------------------------------------
# strategies: {}
