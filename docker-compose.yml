# =====================================================
# 期货预测平台 - 本地编排（PRD §9 / §14.1）
# 三容器：timescaledb + python-api + python-scheduler
# 云端用 docker-compose.cloud.yml 复用同一镜像，仅替换配置
# =====================================================
services:
  timescaledb:
    image: timescale/timescaledb:2.17.1-pg16
    container_name: qhyc-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TS_TUNE_MEMORY: 2
      TS_TUNE_NUM_CPUS: 2
    command:
      - "postgres"
      - "-cshared_buffers=1GB"
      - "-cwork_mem=64MB"
      - "-cmaintenance_work_mem=512MB"
      - "-cmax_connections=100"
      - "-cwal_compression=on"
      # 2026-09-29 实测：全库 2291 个 chunk，而默认值 64 导致任何跨全表查询
      # （count(*) / DISTINCT / VACUUM / 建索引）都报
      # "out of shared memory / max_locks_per_transaction"。
      # TimescaleDB 官方建议按 chunk 数量级调大；取 4096 留足增长空间。
      - "-cmax_locks_per_transaction=4096"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 安全：仅绑宿主环回，不要改回 0.0.0.0。
      # 与 api 的 8000（见下）保持同一策略，也与 docker-compose.cloud.yml 一致。
      # 库内含费率字典 dim_trading_cost、行情与信号数据，且容器内 postgres
      # 监听 0.0.0.0（-clisten_addresses，见 command 段）；宿主这一层若绑全网卡，
      # 等于把整个数据库直接暴露到局域网/公网。外部访问走 ssh -L 隧道：
      #     ssh -L 15432:127.0.0.1:5432 <host>
      # 容器间互访走 compose 网络（服务名 timescaledb），不受此绑定影响。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: qhyc-api
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: timescaledb
      ROLE: api
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
      - ./config:/app/config:ro   # 配置热更新（改 yaml 免重建）
      # 本地历史数据：把 E:\Docker\qhyc\imports 挂到容器 /app/imports（PRD §4.5）
      # 子目录形如 /app/imports/FG/data/FG_daily.json
      - ${LOCAL_QH_PATH:-./imports}:/app/imports:ro
      # 源码/脚本/前端本地挂载：docker 仅提供运行环境，代码改动免重建（重启容器即生效）
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      # ❌ 不再挂 ./web/dist：实测镜像内 dist 与宿主 dist 的 index.html md5 不一致
      #    （d34a38eb vs 6ae90940），即「前端双来源」。统一为**镜像构建产物唯一来源**
      #    （Dockerfile webbuilder 阶段从 web/ 构建），本地/云端完全一致。
      #    改前端后需：docker compose build api && docker compose up -d api
      # M8：WB 决策链路源码只读挂载（与 pipeline 容器共享 ./runtime 下的启动快照，
      #     使 /pipeline/run 手动触发与 /pipeline/manifest 可在 api 侧直接执行）
      - ${WB_PIPELINE_PATH}:/app/pipeline_src:ro
      # M8：简报产物目录（api 只读，供 /pipeline/brief/{date} 读取；写由 pipeline 容器完成）
      - ${QH_BRIEF_PATH}:/app/qh:ro
    ports:
      # 安全：仅绑宿主环回。API 无鉴权时（INTEGRATION_API_KEY 为占位符）不应对局域网开放，
      # 否则 13 个 POST 写端点（ingest/imports/backtest/update-weights/pipeline/run…）可被任意访问。
      # 需要外部访问时走 ssh 隧道或反向代理，不要改回 0.0.0.0。
      - "127.0.0.1:${API_PORT:-8000}:8000"
    command: ["python", "-m", "app.main"]

  scheduler:
    build: .
    container_name: qhyc-scheduler
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_HOST: timescaledb
      ROLE: scheduler
      RUN_ON_BOOT: "0"   # 数据已就绪，避免每次重启重复全量回补（定时任务照常）
      # 本地调度器进入「同步专用」模式：只跑 cloud_local_sync（云->地），不跑采集/重建，
      # 避免与云端调度器重复写库（PRD §14 / app/scheduler.py CLOUD_SYNC_ENABLED 分支）
      CLOUD_SYNC_ENABLED: "1"
      CLOUDPGHOST: host.docker.internal     # 经本机 SSH 隧道 15432 连云
      CLOUDPGPORT: "15432"
      CLOUDPGDBNAME: futures
      CLOUDPGUSER: futures
      CLOUDPGPWD: ${POSTGRES_PASSWORD}
      LOCALPGHOST: timescaledb              # 本地 timescaledb（docker 服务名）
      LOCALPGPORT: "5432"
      LOCALPGDBNAME: futures
      LOCALPGUSER: futures
      LOCALPGPWD: ${POSTGRES_PASSWORD}
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
      - ./config:/app/config:ro
      - ${LOCAL_QH_PATH:-./imports}:/app/imports:ro
      # 源码/脚本本地挂载：docker 仅提供运行环境，代码改动免重建（重启容器即生效）
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      # DB 迁移脚本（与代码同版本，方便在容器内直接 apply）
      - ./migrations:/app/migrations:ro
    # scheduler 不监听端口，禁用继承自 Dockerfile 的 HTTP 健康检查
    healthcheck:
      disable: true
    command: ["python", "-m", "app.scheduler"]

  # =====================================================
  # M8 · 决策链路容器化（docs/M8_决策链路容器化_PRD_20260922.md）
  # 复用同一镜像（不新建 Dockerfile），独立进程：
  #   - 常驻跑 WB 侧五条子链路（简报/研究/基本面/盘中监控/信号）
  #   - 源码 = WB skill 只读挂载 → 启动快照（单一真源，容器内不可漂移）
  #   - 崩溃不影响 qhyc-scheduler 的 */15 fusion_scan 与数据入库
  # 回滚：docker compose stop pipeline && docker compose rm -f pipeline
  # =====================================================
  pipeline:
    build: .
    container_name: qhyc-pipeline
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: timescaledb
      ROLE: pipeline
      TZ: Asia/Shanghai
      QH_BRIEF_BASE: /app/qh
      QH_PG_HOST: timescaledb
      QH_PG_PORT: 5432
      QH_PG_DB: futures
      QH_PG_USER: futures
      QH_PG_PWD: ${POSTGRES_PASSWORD}
      PIPELINE_SNAPSHOT: /app/runtime/pipeline_snapshot
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
      - ./config:/app/config:ro
      - ./app:/app/app:ro
      # WB 单一真源：只读挂载，启动时复制为快照（§5.3）
      - ${WB_PIPELINE_PATH}:/app/pipeline_src:ro
      # 产出目录：与宿主查看/手工调整的是同一份
      - ${QH_BRIEF_PATH}:/app/qh:rw
    mem_limit: 2g            # R4：研究层 quant 回放限内存
    healthcheck:
      test: ["CMD-SHELL", "python -m app.pipeline.healthcheck"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 90s
    command: ["python", "-m", "app.pipeline.worker"]

networks:
  default:
    name: qhyc